name: Korean ETF read-only audit
on:
  push:
    branches: [codex/kr-etf-pagination-audit-20261103]
    paths:
      - '.github/workflows/kr_etf_pagination_audit.yml'
      - 'tools/kr_etf_pagination_audit.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m tools.kr_etf_pagination_audit
