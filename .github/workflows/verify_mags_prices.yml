name: Verify MAGS actual return prices
on:
  push:
    branches: ['codex/verify-mags-20261029']
    paths: ['.github/workflows/verify_mags_prices.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39ccb62b8a62debcefe5be38a4752edd11e6d6e0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install report dependencies
        run: pip install -r requirements.txt
      - name: Audit actual MAGS prices and return periods
        run: |
          python - <<'PY'
          import bisect
          import json
          import math
          from datetime import date
          from pathlib import Path
          import yfinance as yf
          from src.main import _etf_price_performance, _etf_lifetime_metrics
          
          ticker = yf.Ticker("MAGS")
          cutoff = date(2026, 10, 28)
          adjusted_frame = ticker.history(period="max", end="2026-10-29", auto_adjust=True, actions=True, timeout=30)
          raw_frame = ticker.history(period="max", end="2026-10-29", auto_adjust=False, actions=True, timeout=30)
          adjusted = adjusted_frame["Close"].dropna()
          adjusted = adjusted[[stamp.date() <= cutoff for stamp in adjusted.index]]
          if len(adjusted) < 2 or adjusted.index[-1].date() != cutoff:
              raise RuntimeError("MAGS history does not contain the captured 2026-10-28 close")
          dates = [stamp.date() for stamp in adjusted.index]
          prices = [float(value) for value in adjusted.tolist()]
          perf = _etf_price_performance(dates, prices, price_basis="Yahoo provided adjusted close (auto_adjust=True)", price_currency="USD")
          metrics = _etf_lifetime_metrics({"ticker": "MAGS", "market": "US", **perf})
          audit = {**perf, **metrics}
          periods = []
          selected_indices = {0, len(dates)-1}
          for years in (1, 3, 5, 10):
              target = dates[-1].replace(year=dates[-1].year-years)
              index = bisect.bisect_right(dates, target)-1
              if index >= 0:
                  selected_indices.add(index)
              growth = prices[-1]/prices[index] if index >= 0 else None
              periods.append({"period_years": years, "target_date": target.isoformat(), "actual_start_date": dates[index].isoformat() if index >= 0 else None, "end_date": dates[-1].isoformat(), "initial_adjusted_close": prices[index] if index >= 0 else None, "latest_adjusted_close": prices[-1], "cumulative_return_percent": (growth-1)*100 if growth is not None else None, "annualized_return_percent": (growth**(1/years)-1)*100 if growth is not None else None, "reported_cagr": audit["cagr"+str(years)+"y"]})
          selected_prices = []
          for index in sorted(selected_indices):
              stamp = adjusted.index[index]
              source = raw_frame.loc[stamp] if stamp in raw_frame.index else None
              selected_prices.append({"date": dates[index].isoformat(), "yahoo_close": float(source["Close"]) if source is not None else None, "yahoo_adj_close": float(source["Adj Close"]) if source is not None and "Adj Close" in source and math.isfinite(float(source["Adj Close"])) else None, "auto_adjusted_close_used": prices[index], "currency": "USD"})
          actions = []
          for stamp, row in raw_frame.iterrows():
              dividends = float(row.get("Dividends",0) or 0)
              splits = float(row.get("Stock Splits",0) or 0)
              gains = float(row.get("Capital Gains",0) or 0)
              if dividends or splits or gains:
                  actions.append({"date":stamp.date().isoformat(),"dividends":dividends,"stock_splits":splits,"capital_gains":gains})
          capture = {"cagr1y":5.8,"cagr3y":36.9,"cumulative_return":199.2,"lifetime_cagr":36.2,"lifetime_years":3.55}
          actual = {key:round(audit[key],2 if key=="lifetime_years" else 1) for key in capture}
          result = {"ticker":"MAGS","cutoff":cutoff.isoformat(),"capture":capture,"reproduced":actual,"matches_capture":capture==actual,"audit":audit,"periods":periods,"selected_prices":selected_prices,"actions":actions}
          print("MAGS_PRICE_AUDIT:"+json.dumps(result,ensure_ascii=False),flush=True)
          three = next(item for item in periods if item["period_years"]==3)
          early_ratio = three["initial_adjusted_close"]/prices[0]
          print("MAGS_PERIOD_BRIDGE:"+json.dumps({"first_date":dates[0].isoformat(),"three_year_start":three["actual_start_date"],"early_growth":early_ratio,"early_cumulative_percent":(early_ratio-1)*100,"three_year_growth":prices[-1]/three["initial_adjusted_close"],"whole_growth":prices[-1]/prices[0]},ensure_ascii=False),flush=True)
          directory=Path("work"); directory.mkdir(exist_ok=True)
          (directory/"mags-price-audit.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          export=raw_frame.copy()
          export["Auto adjusted close used"]=adjusted.reindex(export.index)
          export.to_csv(directory/"mags-price-history.csv",index_label="Date")
          if capture != actual:
              raise RuntimeError("Captured MAGS figures did not reproduce; inspect full raw-price audit")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mags-price-verification
          path: |
            work/mags-price-audit.json
            work/mags-price-history.csv
          if-no-files-found: ignore
          retention-days: 7
