name: US batch parser audit
on:
  push:
    branches: [codex/us-batch-audit-20261117]
    paths: ['tools/us_batch_audit.py', '.github/workflows/us_batch_audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: python -m tools.us_batch_audit
