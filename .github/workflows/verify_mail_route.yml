name: Verify configured report mail route
on:
  push:
    branches: ['codex/verify-mail-route-20261029']
    paths: ['.github/workflows/verify_mail_route.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare expected addresses without sending or displaying secrets
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        run: |
          python - <<'PY'
          import json, os
          recipient = os.environ.get('RECIPIENT_EMAIL', 'ykhan@dacpole.com')
          sender = os.environ.get('GMAIL_USER', '')
          route = {
              'recipient_present': bool(recipient),
              'recipient_matches_company': recipient.strip().lower() == 'ykhan@dacpole.com',
              'recipient_matches_connected_gmail': recipient.strip().lower() == 'hansharedid@gmail.com',
              'sender_matches_connected_gmail': sender.strip().lower() == 'hansharedid@gmail.com',
              'recipient_has_whitespace': recipient != recipient.strip(),
              'recipient_has_multiple_separators': any(c in recipient for c in ',;'),
              'sender_and_recipient_equal': recipient.strip().lower() == sender.strip().lower(),
          }
          print('MAIL_ROUTE_CHECK:' + json.dumps(route), flush=True)
          PY
