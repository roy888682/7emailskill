name: GBTC price history audit
on:
  push:
    branches: [codex/gbtc-history-audit-20261103]
    paths:
      - '.github/workflows/gbtc_history_audit.yml'
      - 'tools/gbtc_history_audit.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m tools.gbtc_history_audit
