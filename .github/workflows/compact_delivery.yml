name: ATH compact report recovery
on:
  push:
    branches: [codex/delivery-recovery-20261107]
    paths:
      - '.github/workflows/compact_delivery.yml'
      - 'tools/mail_delivery_recovery.py'
      - 'src/native_email.py'
permissions:
  contents: read
jobs:
  recover:
    if: github.event.head_commit.message == 'Send one semantically identical compact ATH report'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install report parsing dependencies
        run: pip install beautifulsoup4 html5lib pytz Pillow
      - name: Verify every field and resend one smaller complete report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python tools/mail_delivery_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-delivery-recovery-${{ github.run_id }}
          path: |
            work/mail-path-audit.json
            work/recovered-report.html
          if-no-files-found: ignore
          retention-days: 7
