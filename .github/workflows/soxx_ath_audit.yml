name: SOXX ATH price audit
on:
  push:
    branches: [codex/soxx-ath-audit-20261106]
    paths: ['.github/workflows/soxx_ath_audit.yml','tools/soxx_ath_audit.py']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m tools.soxx_ath_audit
