name: Native email size measurement
on:
  push:
    branches: [main]
    paths: ['tools/native_mail_probe.py']
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/daily_snapshots.json
          key: ath-snapshot-${{ github.run_id }}
          restore-keys: |
            ath-snapshot-
      - run: python tools/native_mail_probe.py
      - uses: actions/cache/save@v4
        with:
          path: |
            work/email-body.html
            work/email-reference.html
            work/report-manifest.json
            work/email-subject.txt
            work/pending-snapshots.json
          key: ath-native-source-${{ github.run_id }}
