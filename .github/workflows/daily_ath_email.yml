name: 📈 Daily ATH Stock Email

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 22:00 UTC = 07:00 KST (화~토)
  workflow_dispatch:

permissions:
  contents: write             # data/daily_snapshots.json 자동 commit 허용

jobs:
  send-ath-email:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: ⬇️ 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}          # detached HEAD 방지 — 명시적으로 브랜치에 체크아웃

      - name: 🐍 Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 의존성 설치
        run: pip install -r requirements.txt

      - name: 📧 ATH 이메일 발송
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/main.py

      - name: 📊 티커 히스토리 저장
        run: |
          git config user.name  "ATH Bot"
          git config user.email "bot@noreply.github.com"
          echo "── 저장 전 현재 커밋 ──"
          git rev-parse HEAD
          git add data/daily_snapshots.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 — commit 생략"
          else
            git commit -m "data: $(date +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "── 저장 후 커밋 (원격에 실제로 반영된 지점) ──"
          git log --oneline -3
