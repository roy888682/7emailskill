name: 📈 Daily ATH Stock Email

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
  schedule:
    - cron: '0 22 * * 1-5'   # UTC 월~금 22:00 = KST 화~토 07:00 (일·월 발송 없음)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ath-email
  cancel-in-progress: true

jobs:
  send-ath-email:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: ⬇️ 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🧹 체크아웃으로 딸려온 구버전 스냅샷 파일 제거 (캐시만 신뢰하도록 강제)
        run: |
          if [ -f "data/daily_snapshots.json" ]; then
            echo "⚠️ git에 커밋된 구버전 스냅샷 파일 발견 — 삭제함 (캐시 복원본만 사용)"
            rm -f data/daily_snapshots.json
          else
            echo "✅ git에 커밋된 스냅샷 파일 없음 (정상)"
          fi

      - name: 🔍 파일 무결성 검증 (최신 코드인지 실행 전에 확정)
        run: |
          if [ -f "main.py" ]; then
            echo "❌ 저장소 최상위에 main.py 중복 파일이 존재함 — 삭제 필요"
            exit 1
          fi
          if [ -f "daily_ath_email.yml" ]; then
            echo "❌ 저장소 최상위에 daily_ath_email.yml 중복 파일이 존재함 — 삭제 필요"
            exit 1
          fi
          if ! grep -q "daily_snapshots" src/main.py; then
            echo "❌ src/main.py 가 구버전임 — 최신 코드로 교체 필요"
            exit 1
          fi
          echo "✅ 파일 검증 통과"

      - name: 🐍 Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 의존성 및 화면 검증 도구 설치
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: 📥 이전 누적 스냅샷 복원 (git push 대신 Actions Cache 사용)
        uses: actions/cache/restore@v4
        with:
          path: data/daily_snapshots.json
          key: ath-snapshot-${{ github.run_id }}
          restore-keys: |
            ath-snapshot-

      - name: 📄 복원 결과 확인
        run: |
          if [ -f "data/daily_snapshots.json" ]; then
            echo "✅ 캐시에서 스냅샷 파일 복원됨"
            python3 -c "import json; d=json.load(open('data/daily_snapshots.json')); print(f'US {len(d.get(\"US\",{}))}일치, KR {len(d.get(\"KR\",{}))}일치 복원됨')"
          else
            echo "ℹ️ 복원된 캐시 없음 (최초 실행이거나 캐시 만료됨) — 오늘자로 새로 시작함"
          fi

      - name: 🧪 수익률·메일 레이아웃 검증
        run: python -m unittest discover -s tests -v

      - name: 📄 전체 본문 준비 (아직 발송하지 않음)
        run: python src/main.py --prepare-only

      - name: Verify the complete ETF comparison and return columns
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import date
          from pathlib import Path
          from bs4 import BeautifulSoup
          from src.email_layout import ETF_MINIMUM_YEARS

          work = Path("work")
          audit = json.loads((work / "market-date-proof.json").read_text(encoding="utf-8"))
          manifest = json.loads((work / "report-manifest.json").read_text(encoding="utf-8"))
          eligible = []
          for row in audit["etfs"]:
              cagr = row.get("lifetime_cagr")
              if not row["in_comparison_universe"] or not isinstance(cagr, (int, float)) or not math.isfinite(cagr):
                  continue
              days = (date.fromisoformat(row["price_end_date"]) - date.fromisoformat(row["price_start_date"])).days
              if days / 365.25 >= ETF_MINIMUM_YEARS:
                  eligible.append(row)
          expected_values = sorted((row["lifetime_cagr"] for row in eligible), reverse=True)
          doc = BeautifulSoup((work / "email-body.html").read_text(encoding="utf-8"), "html5lib")
          assert doc.select_one("#etf-low, #returns-low") is None
          assert len(manifest["etf"]) == len(eligible)
          by_identity = {(row["country"], row["ticker"]): row["lifetime_cagr"] for row in eligible}
          rows = doc.select("#returns tbody tr")
          observed = []
          for rank, row in enumerate(rows, 1):
              cells = row.find_all("td", recursive=False)
              assert cells[0].get_text(strip=True) == str(rank)
              country = {"태극기": "KR", "성조기": "US"}[cells[1].find("img")["alt"]]
              ticker = cells[2].find("a").get_text(strip=True)
              observed.append(by_identity[country, ticker])
              assert "cagr" in cells[12].get("class", [])
          assert observed == expected_values
          headings = [cell.get_text(strip=True) for cell in doc.select("#returns thead th")][6:13]
          if rows:
              assert headings[:5] == ["연초", "1년", "2년", "3년", "10년"]
              assert headings[5].startswith("누적") and headings[6] == "연평균"
          print("COMPLETE_ETF_RANKING_VERIFIED:" + json.dumps({
              "eligible": len(eligible), "displayed": len(rows), "minimum_years": ETF_MINIMUM_YEARS,
              "headings": headings, "first_ticker": manifest["etf"][0] if rows else None,
              "last_ticker": manifest["etf"][-1] if rows else None,
              "cagr_max": observed[0] if rows else None, "cagr_min": observed[-1] if rows else None
          }, ensure_ascii=False), flush=True)
          PY

      - name: 🖥️ 한미 HTML 글자·양식·전체 종목·확대 글꼴 검증
        run: python tools/preview_email.py --html work/email-body.html --manifest work/report-manifest.json --reference work/email-reference.html

      - name: 📧 검증된 전체 본문 발송
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/main.py --send-prepared

      - name: 💾 누적 스냅샷 저장 (다음 실행에서 자동 복원됨)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/daily_snapshots.json
          key: ath-snapshot-${{ github.run_id }}

      - name: 📎 실패 진단 파일 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: email-delivery-diagnostics-${{ github.run_id }}
          path: |
            work/*.json
            work/*.html
            work/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 📬 SMTP 접수 식별자 보관 (수신함 도착 확인과 별도)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smtp-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/smtp-accepted.json
          if-no-files-found: ignore
          retention-days: 14
