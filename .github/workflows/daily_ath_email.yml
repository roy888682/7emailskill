name: 📈 Daily ATH Stock Email & DB

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  send-ath-email:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: ⬇️ 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 패키지 직접 설치 (에러 원천 차단)
        run: pip install yfinance FinanceDataReader pandas beautifulsoup4 requests pytz gspread oauth2client

      - name: 📧 이메일 발송 및 구글시트 저장
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python src/main.py
