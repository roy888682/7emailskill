name: 📈 Daily ATH Stock Email

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
  schedule:
    - cron: '0 22 * * 1-5'   # UTC 월~금 22:00 = KST 화~토 07:00 (일·월 발송 없음)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ath-email
  cancel-in-progress: true

jobs:
  send-ath-email:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: ⬇️ 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🧹 체크아웃으로 딸려온 구버전 스냅샷 파일 제거 (캐시만 신뢰하도록 강제)
        run: |
          if [ -f "data/daily_snapshots.json" ]; then
            echo "⚠️ git에 커밋된 구버전 스냅샷 파일 발견 — 삭제함 (캐시 복원본만 사용)"
            rm -f data/daily_snapshots.json
          else
            echo "✅ git에 커밋된 스냅샷 파일 없음 (정상)"
          fi

      - name: 🔍 파일 무결성 검증 (최신 코드인지 실행 전에 확정)
        run: |
          if [ -f "main.py" ]; then
            echo "❌ 저장소 최상위에 main.py 중복 파일이 존재함 — 삭제 필요"
            exit 1
          fi
          if [ -f "daily_ath_email.yml" ]; then
            echo "❌ 저장소 최상위에 daily_ath_email.yml 중복 파일이 존재함 — 삭제 필요"
            exit 1
          fi
          if ! grep -q "daily_snapshots" src/main.py; then
            echo "❌ src/main.py 가 구버전임 — 최신 코드로 교체 필요"
            exit 1
          fi
          echo "✅ 파일 검증 통과"

      - name: 🐍 Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 의존성 및 화면 검증 도구 설치
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: 📥 이전 누적 스냅샷 복원 (git push 대신 Actions Cache 사용)
        uses: actions/cache/restore@v4
        with:
          path: data/daily_snapshots.json
          key: ath-snapshot-${{ github.run_id }}
          restore-keys: |
            ath-snapshot-

      - name: 📄 복원 결과 확인
        run: |
          if [ -f "data/daily_snapshots.json" ]; then
            echo "✅ 캐시에서 스냅샷 파일 복원됨"
            python3 -c "import json; d=json.load(open('data/daily_snapshots.json')); print(f'US {len(d.get(\"US\",{}))}일치, KR {len(d.get(\"KR\",{}))}일치 복원됨')"
          else
            echo "ℹ️ 복원된 캐시 없음 (최초 실행이거나 캐시 만료됨) — 오늘자로 새로 시작함"
          fi

      - name: 🧪 수익률·메일 레이아웃 검증
        run: python -m unittest discover -s tests -v

      - name: 📄 전체 본문 준비 (아직 발송하지 않음)
        run: python src/main.py --prepare-only

      - name: Verify ETF selection, GBTC lifecycle dates and red initial-price markers
        run: |
          python - <<'PY'
          import json, math
          from datetime import date
          from pathlib import Path
          from bs4 import BeautifulSoup
          from src.email_layout import ETF_MINIMUM_YEARS, ETF_COMPARISON_LIMIT
          proof = json.loads(Path("work/market-date-proof.json").read_text())
          manifest = json.loads(Path("work/report-manifest.json").read_text())
          pool = [row for row in proof["etfs"] if row["in_comparison_universe"]]
          calculable = [row for row in pool if isinstance(row.get("lifetime_cagr"), (int, float)) and math.isfinite(row["lifetime_cagr"])]
          def years(row):
              return (date.fromisoformat(row["price_end_date"]) - date.fromisoformat(row["price_start_date"])).days / 365.25
          eligible = sorted([row for row in calculable if years(row) >= ETF_MINIMUM_YEARS], key=lambda row: row["lifetime_cagr"], reverse=True)
          records = {row["ticker"]: row for row in pool}
          selected = [records[ticker] for ticker in manifest["etf"]]
          assert len(selected) == min(ETF_COMPARISON_LIMIT, len(eligible))
          assert all(years(row) >= ETF_MINIMUM_YEARS for row in selected)
          assert [row["lifetime_cagr"] for row in selected] == [row["lifetime_cagr"] for row in eligible[:ETF_COMPARISON_LIMIT]]
          print("ETF_SELECTION_VERIFIED:" + json.dumps({"minimum_years": ETF_MINIMUM_YEARS, "limit": ETF_COMPARISON_LIMIT, "pool": len(pool), "calculable": len(calculable), "eligible": len(eligible), "excluded_below_minimum": len(calculable)-len(eligible), "displayed": len(selected), "minimum_displayed_years": min((years(row) for row in selected), default=None)}), flush=True)
          row = records["GBTC"]
          assert row["inception"] == row["etf_listing_date"] == "2024-01-11"
          assert row["trust_inception"] == "2013-09-25" and row["public_quotation_date"] == "2015-05-04"
          assert row["price_start_date"] >= row["etf_listing_date"]
          assert years(row) < ETF_MINIMUM_YEARS and "GBTC" not in manifest["etf"]
          assert all(row[key] is None for key in ("return3y", "return5y", "return10y"))
          fields = ("ticker", "inception", "inception_label", "inception_url", "trust_inception", "public_quotation_date", "etf_listing_date", "price_start_date", "price_end_date", "initial_adjusted_price", "latest_adjusted_price", "cumulative_return", "lifetime_cagr", "lifetime_years", "price_basis", "date_status", "in_comparison_universe")
          print("GBTC_ETF_PERIOD_VERIFIED:" + json.dumps({key:row.get(key) for key in fields}, ensure_ascii=False), flush=True)
          doc = BeautifulSoup(Path("work/email-body.html").read_text(), "html5lib")
          expected_red = sum(0 < row["initial_adjusted_price"] < 1 for row in selected)
          assert len(doc.select("#returns .initial-price-small")) == expected_red
          print("SUBUNIT_INITIAL_PRICE_MARKERS_VERIFIED:" + json.dumps({"expected_red":expected_red, "displayed":len(selected)}), flush=True)
          PY

      - name: 🖥️ 한미 HTML 글자·양식·전체 종목·확대 글꼴 검증
        run: python tools/preview_email.py --html work/email-body.html --manifest work/report-manifest.json --reference work/email-reference.html

      - name: 📧 검증된 전체 본문 발송
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/main.py --send-prepared

      - name: 💾 누적 스냅샷 저장 (다음 실행에서 자동 복원됨)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/daily_snapshots.json
          key: ath-snapshot-${{ github.run_id }}

      - name: 📎 실패 진단 파일 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: email-delivery-diagnostics-${{ github.run_id }}
          path: |
            work/*.json
            work/*.html
            work/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 📬 SMTP 접수 식별자 보관 (수신함 도착 확인과 별도)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smtp-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/smtp-accepted.json
          if-no-files-found: ignore
          retention-days: 14
