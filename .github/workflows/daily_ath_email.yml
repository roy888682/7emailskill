name: 📈 Daily ATH Stock Email

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 22:00 UTC = 07:00 KST (화~토)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**']

jobs:
  send-ath-email:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[send-new-list-aum]')
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: ⬇️ 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🧹 체크아웃으로 딸려온 구버전 스냅샷 파일 제거 (캐시만 신뢰하도록 강제)
        run: |
          if [ -f "data/daily_snapshots.json" ]; then
            echo "⚠️ git에 커밋된 구버전 스냅샷 파일 발견 — 삭제함 (캐시 복원본만 사용)"
            rm -f data/daily_snapshots.json
          else
            echo "✅ git에 커밋된 스냅샷 파일 없음 (정상)"
          fi

      - name: 🔍 파일 무결성 검증 (최신 코드인지 실행 전에 확정)
        run: |
          if [ -f "main.py" ]; then
            echo "❌ 저장소 최상위에 main.py 중복 파일이 존재함 — 삭제 필요"
            exit 1
          fi
          if [ -f "daily_ath_email.yml" ]; then
            echo "❌ 저장소 최상위에 daily_ath_email.yml 중복 파일이 존재함 — 삭제 필요"
            exit 1
          fi
          if ! grep -q "daily_snapshots" src/main.py; then
            echo "❌ src/main.py 가 구버전임 — 최신 코드로 교체 필요"
            exit 1
          fi
          echo "✅ 파일 검증 통과"

      - name: 🐍 Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 의존성 설치
        run: pip install -r requirements.txt

      - name: 📥 이전 누적 스냅샷 복원 (git push 대신 Actions Cache 사용)
        uses: actions/cache/restore@v4
        with:
          path: data/daily_snapshots.json
          key: ath-snapshot-${{ github.run_id }}
          restore-keys: |
            ath-snapshot-

      - name: 📄 복원 결과 확인
        run: |
          if [ -f "data/daily_snapshots.json" ]; then
            echo "✅ 캐시에서 스냅샷 파일 복원됨"
            python3 -c "import json; d=json.load(open('data/daily_snapshots.json')); print(f'US {len(d.get(\"US\",{}))}일치, KR {len(d.get(\"KR\",{}))}일치 복원됨')"
          else
            echo "ℹ️ 복원된 캐시 없음 (최초 실행이거나 캐시 만료됨) — 오늘자로 새로 시작함"
          fi

      - name: 🧪 수익률·메일 레이아웃 검증
        run: python -m unittest discover -s tests -v

      - name: 📧 ATH 이메일 발송
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/main.py

      - name: 실제 발송 메일 PC 레이아웃 검증
        if: github.event_name == 'push'
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          for html in work/email-preview*.html; do
            output="work/check-$(basename "$html" .html)"
            python tools/preview_email.py --html "$html" --output "$output"
          done

      - name: 실제 메일 미리보기 저장
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sent-email-desktop
          path: work/

      - name: 💾 누적 스냅샷 저장 (다음 실행에서 자동 복원됨)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/daily_snapshots.json
          key: ath-snapshot-${{ github.run_id }}

  preview-email:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-new-list-aum-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Unit regressions
        run: python -m unittest discover -s tests -v
      - name: PC email layout checks
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          python tools/preview_email.py
      - uses: actions/upload-artifact@v4
        with:
          name: new-list-aum-desktop-preview
          path: work/
