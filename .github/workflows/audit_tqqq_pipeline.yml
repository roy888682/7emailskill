name: Verify TQQQ price and candidate pipeline
on:
  push:
    branches: [codex/tqqq-audit-20261102]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit three ETFs with actual adjusted prices and current production filters
        run: python tools/audit_tqqq_pipeline.py
