name: Report validation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/report_validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/report_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test and browser dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Prepare representative country and new-security counts
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from tools.preview_email import sample_data, make_stock, manifest_for, set_sample_period_returns, set_sample_management_style
          from src.email_layout import render_email
          from src.main import validate_etf_market_dates, bind_market_date_proof, _etf_lifetime_metrics, build_etf_info, ETF_CALCULATION_FIELDS, ETF_PERIOD_FIELDS
          from src.etf_strategy import management_style_metadata
          data = sample_data()
          base_etfs = data["etf_info"]["rows"]
          data["us"] = [make_stock("US%04d" % i, number=i, asset_type="주식" if i < 75 else "ETF") for i in range(229)]
          data["kr"] = [make_stock("KR%04d" % i, market="KOSPI", number=i, asset_type="주식" if i < 4 else "ETF") for i in range(11)]
          cohort = [row for row in data["kr"] + data["us"] if row["asset_type"] == "ETF"]
          for index, row in enumerate(cohort):
              identity = dict(row)
              row.update(base_etfs[index % len(base_etfs)])
              row.update(identity)
              row["price_currency"] = "USD" if row["market"] == "US" else "KRW"
              row["price_basis"] = "Yahoo 제공 수정주가(auto_adjust)" if row["market"] == "US" else "네이버 차트 종가·배당조정 미확인"
              if index in (0, 7, 160):
                  actual_end = "2026-10-02" if index == 160 else "2026-10-06"
                  row["price_end_date"] = row["last_date"] = row["return_as_of"] = actual_end
                  row["lifetime_years"] = (date.fromisoformat(actual_end) - date.fromisoformat(row["price_start_date"])).days / 365.25
              if index in (0, 1, 2):
                  start_date = ("2026-04-01", "2025-10-07", "2025-10-06")[index]
                  row["price_start_date"] = row["first_date"] = start_date
                  row["lifetime_years"] = (date.fromisoformat(row["price_end_date"]) - date.fromisoformat(start_date)).days / 365.25
              row["lifetime_cagr"] = 40.0 - index * .4
              if index in (0, 1):
                  row["lifetime_cagr"] = 400.0 - index
              row["cumulative_return"] = ((1 + row["lifetime_cagr"] / 100) ** row["lifetime_years"] - 1) * 100
              row["initial_adjusted_price"] = .0000123456789012 if index == 0 else 100.123456789
              row["latest_adjusted_price"] = row["initial_adjusted_price"] * (1 + row["cumulative_return"] / 100)
              row["cumulative_growth"] = row["latest_adjusted_price"] / row["initial_adjusted_price"]
              row.update(_etf_lifetime_metrics(row))
              set_sample_period_returns(row)
              set_sample_management_style(row, index)
          tqqq = dict(base_etfs[0])
          tqqq.update(make_stock("TQQQ", asset_type="ETF"))
          tqqq.update(name="ProShares UltraPro QQQ synthetic price fixture", gap=-28.6,
                      inception="2010-02-09", inception_verified=True,
                      inception_source="ProShares ETF 설정일", first_date="2010-02-11",
                      price_start_date="2010-02-11", price_end_date="2026-10-07",
                      last_date="2026-10-07", return_as_of="2026-10-07",
                      price_currency="USD", price_basis="Yahoo 제공 수정주가(auto_adjust)",
                      initial_adjusted_price=.2051851749420166, lifetime_cagr=40.73)
          tqqq["lifetime_years"] = (date.fromisoformat(tqqq["price_end_date"]) - date.fromisoformat(tqqq["price_start_date"])).days / 365.25
          tqqq["latest_adjusted_price"] = tqqq["initial_adjusted_price"] * (1 + tqqq["lifetime_cagr"] / 100) ** tqqq["lifetime_years"]
          tqqq["cumulative_growth"] = tqqq["latest_adjusted_price"] / tqqq["initial_adjusted_price"]
          tqqq["cumulative_return"] = (tqqq["cumulative_growth"] - 1) * 100
          for field in ("management_style", "management_style_source", "management_style_url", "management_style_verified", "management_style_evidence"):
              tqqq.pop(field, None)
          tqqq.update(management_style_metadata(tqqq))
          tqqq.update(_etf_lifetime_metrics(tqqq))
          set_sample_period_returns(tqqq)
          comparison_only = []
          for index in range(600):
              row = dict(base_etfs[0])
              row.update(make_stock("ONLY%04d" % index, asset_type="ETF"))
              row["lifetime_cagr"] = 30.5 - index * .05
              row["initial_adjusted_price"] = 100.123456789
              row["latest_adjusted_price"] = row["initial_adjusted_price"] * (1 + row["lifetime_cagr"] / 100) ** row["lifetime_years"]
              row["cumulative_growth"] = row["latest_adjusted_price"] / row["initial_adjusted_price"]
              row["cumulative_return"] = (row["cumulative_growth"] - 1) * 100
              row.update(_etf_lifetime_metrics(row))
              set_sample_period_returns(row)
              set_sample_management_style(row, index)
              comparison_only.append(row)
          unavailable = make_stock("NOHISTORY", asset_type="ETF")
          for field in ETF_CALCULATION_FIELDS:
              unavailable[field] = None
          unavailable.update(period_returns={key: None for key in ETF_PERIOD_FIELDS},
                             requested_market_date="2026-10-07", date_status="unavailable")
          set_sample_management_style(unavailable, 2)
          comparison_etfs = cohort + comparison_only + [tqqq, unavailable]
          data["etf_info"] = build_etf_info(data["us"], data["kr"], comparison_etfs=comparison_etfs)
          assert data["etf_info"]["rows"][0]["ticker"] == "TQQQ"
          assert all(row["ticker"] != "TQQQ" for row in data["us"])
          assert data["etf_info"]["pool"] == 763 and data["etf_info"]["with_ret"] == 762
          assert data["etf_info"]["eligible_count"] == 760 and data["etf_info"]["below_minimum_years"] == 2
          ranked = data["etf_info"]["rows"]
          assert len(ranked) == data["etf_info"]["eligible_count"]
          assert ranked[-1]["ticker"] == cohort[-1]["ticker"] and ranked[-1]["lifetime_cagr"] < 0
          assert all(row["lifetime_years"] >= 1 for row in ranked)
          assert [row["lifetime_cagr"] for row in ranked] == sorted((row["lifetime_cagr"] for row in ranked), reverse=True)
          assert not {cohort[0]["ticker"], cohort[1]["ticker"]} & {row["ticker"] for row in ranked}
          assert cohort[2]["ticker"] in {row["ticker"] for row in ranked}
          data["new_us"] = data["us"][:5] + data["us"][75:99]
          data["new_kr"] = data["kr"][:1] + data["kr"][4:7]
          for row in data["us"] + data["kr"] + ranked:
              row["name"] = ("한국반도체인공지능산업솔루션 " if row["market"] != "US" else "Semiconductor Infrastructure Holdings ") + row["ticker"]
              row["industry"] = row["investment_area"] = "반도체 장비 및 인공지능 인프라"
              row["index"] = ["S&P500", "NASDAQ"] if row["market"] == "US" else ["KOSPI"]
          directory = Path("work")
          directory.mkdir(exist_ok=True)
          html = render_email(**data)
          manifest = manifest_for(data)
          assert manifest["etf"] == [row["ticker"] for row in ranked]
          (directory / "email-body.html").write_text(html, encoding="utf-8")
          (directory / "email-reference.html").write_text(render_email(**data, compact=False), encoding="utf-8")
          (directory / "report-manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          market_proof = bind_market_date_proof(html, manifest, validate_etf_market_dates(data["us"], data["kr"], data["info"], comparison_etfs=comparison_etfs))
          assert len(market_proof["etfs"]) == 763
          assert sum(row.get("lifetime_years") is not None and row["lifetime_years"] < 1 for row in market_proof["etfs"]) == 2
          assert next(row for row in market_proof["etfs"] if row["ticker"] == "TQQQ")["in_ath_report"] is False
          assert next(row for row in market_proof["etfs"] if row["ticker"] == "TQQQ")["in_comparison_universe"] is True
          assert market_proof["status_counts"]["unavailable"] == 1
          (directory / "market-date-proof.json").write_text(json.dumps(market_proof, ensure_ascii=False), encoding="utf-8")
          PY
      - name: Verify complete native body at all desktop widths
        run: python tools/preview_email.py --html work/email-body.html --manifest work/report-manifest.json --reference work/email-reference.html
      - name: Save preview and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validation
          path: |
            work/*.html
            work/*.json
            work/*.png
          if-no-files-found: ignore
          retention-days: 7
