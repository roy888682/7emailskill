name: Report validation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/report_validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/report_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test and browser dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Prepare representative country and new-security counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.preview_email import sample_data, make_stock, manifest_for
          from src.email_layout import render_email
          data = sample_data()
          data["us"] = [make_stock("US%04d" % i, number=i, asset_type="주식" if i < 75 else "ETF") for i in range(229)]
          data["kr"] = [make_stock("KR%04d" % i, market="KOSPI", number=i, asset_type="주식" if i < 4 else "ETF") for i in range(11)]
          data["new_us"] = data["us"][:5] + data["us"][75:99]
          data["new_kr"] = data["kr"][:1] + data["kr"][4:7]
          for row in data["us"] + data["kr"] + data["etf_info"]["rows"]:
              row["name"] = row["ticker"]
              row["industry"] = row["investment_area"] = "반도체"
              row["index"] = ["NASDAQ"] if row["market"] == "US" else ["KOSPI"]
          directory = Path("work")
          directory.mkdir(exist_ok=True)
          (directory / "email-body.html").write_text(render_email(**data), encoding="utf-8")
          (directory / "email-reference.html").write_text(render_email(**data, compact=False), encoding="utf-8")
          (directory / "report-manifest.json").write_text(json.dumps(manifest_for(data)), encoding="utf-8")
          PY
      - name: Verify complete native body at all desktop widths
        run: python tools/preview_email.py --html work/email-body.html --manifest work/report-manifest.json --reference work/email-reference.html
      - name: Save preview and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validation
          path: |
            work/*.html
            work/*.json
            work/*.png
          if-no-files-found: ignore
          retention-days: 7
