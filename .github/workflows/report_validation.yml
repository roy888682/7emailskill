name: Report validation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/report_validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/report_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test and browser dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Prepare representative country and new-security counts
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from tools.preview_email import sample_data, make_stock, manifest_for, set_sample_period_returns
          from src.email_layout import render_email
          from src.main import validate_etf_market_dates, bind_market_date_proof, _etf_lifetime_metrics
          data = sample_data()
          base_etfs = data["etf_info"]["rows"]
          data["us"] = [make_stock("US%04d" % i, number=i, asset_type="주식" if i < 75 else "ETF") for i in range(229)]
          data["kr"] = [make_stock("KR%04d" % i, market="KOSPI", number=i, asset_type="주식" if i < 4 else "ETF") for i in range(11)]
          cohort = [row for row in data["kr"] + data["us"] if row["asset_type"] == "ETF"]
          for index, row in enumerate(cohort):
              identity = dict(row)
              row.update(base_etfs[index % len(base_etfs)])
              row.update(identity)
              row["price_currency"] = "USD" if row["market"] == "US" else "KRW"
              row["price_basis"] = "Yahoo 제공 수정주가(auto_adjust)" if row["market"] == "US" else "네이버 차트 종가·배당조정 미확인"
              if index in (0, 7, 160):
                  actual_end = "2026-10-02" if index == 160 else "2026-10-06"
                  row["price_end_date"] = row["last_date"] = row["return_as_of"] = actual_end
                  row["lifetime_years"] = (date.fromisoformat(actual_end) - date.fromisoformat(row["price_start_date"])).days / 365.25
              row["lifetime_cagr"] = 100.0 - index * .5
              row["cumulative_return"] = ((1 + row["lifetime_cagr"] / 100) ** row["lifetime_years"] - 1) * 100
              row["initial_adjusted_price"] = .0000123456789012 if index == 0 else 100.123456789
              row["latest_adjusted_price"] = row["initial_adjusted_price"] * (1 + row["cumulative_return"] / 100)
              row["cumulative_growth"] = row["latest_adjusted_price"] / row["initial_adjusted_price"]
              row.update(_etf_lifetime_metrics(row))
              set_sample_period_returns(row)
          data["etf_info"] = {"rows": [dict(row) for row in cohort[:100]], "pool": len(cohort), "with_ret": len(cohort)}
          data["new_us"] = data["us"][:5] + data["us"][75:99]
          data["new_kr"] = data["kr"][:1] + data["kr"][4:7]
          for row in data["us"] + data["kr"] + data["etf_info"]["rows"]:
              row["name"] = ("한국반도체인공지능산업솔루션 " if row["market"] != "US" else "Semiconductor Infrastructure Holdings ") + row["ticker"]
              row["industry"] = row["investment_area"] = "반도체 장비 및 인공지능 인프라"
              row["index"] = ["S&P500", "NASDAQ"] if row["market"] == "US" else ["KOSPI"]
          directory = Path("work")
          directory.mkdir(exist_ok=True)
          html = render_email(**data)
          manifest = manifest_for(data)
          (directory / "email-body.html").write_text(html, encoding="utf-8")
          (directory / "email-reference.html").write_text(render_email(**data, compact=False), encoding="utf-8")
          (directory / "report-manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          market_proof = bind_market_date_proof(html, manifest, validate_etf_market_dates(data["us"], data["kr"], data["info"]))
          (directory / "market-date-proof.json").write_text(json.dumps(market_proof, ensure_ascii=False), encoding="utf-8")
          PY
      - name: Verify complete native body at all desktop widths
        run: python tools/preview_email.py --html work/email-body.html --manifest work/report-manifest.json --reference work/email-reference.html
      - name: Save preview and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validation
          path: |
            work/*.html
            work/*.json
            work/*.png
          if-no-files-found: ignore
          retention-days: 7
