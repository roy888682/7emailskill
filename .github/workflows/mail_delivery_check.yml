name: ATH mail delivery check
on:
  push:
    branches: [codex/delivery-check-20261105]
    paths:
      - '.github/workflows/mail_delivery_check.yml'
      - 'tools/mail_delivery_check.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original delivery and send one small diagnostic
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python tools/mail_delivery_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-delivery-check-${{ github.run_id }}
          path: work/mail-path-audit.json
          if-no-files-found: ignore
          retention-days: 7
